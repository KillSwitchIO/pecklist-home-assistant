# Runs on the GitHub mirror, where HACS installs from: Home Assistant's hassfest and HACS's own
# check of the repository. The tests run on GitLab (.gitlab-ci.yml).
name: Validate

on:
    push:
        branches: [main]
    schedule:
        - cron: '17 5 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    hassfest:
        if: github.repository == 'KillSwitchIO/pecklist-home-assistant'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: home-assistant/actions/hassfest@master

    hacs:
        if: github.repository == 'KillSwitchIO/pecklist-home-assistant'
        runs-on: ubuntu-latest
        steps:
            - uses: hacs/action@main
              with:
                  category: integration
