# The GitHub repository is a one-way mirror of GitLab, where this integration is developed. HACS
# installs from GitHub releases, so when a version tag arrives (plain x.y.z, matching
# manifest.json) this publishes the release for it.
name: Release

on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+'

jobs:
    release:
        if: github.repository == 'KillSwitchIO/pecklist-home-assistant'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Check the tag matches manifest.json
              env:
                  TAG: ${{ github.ref_name }}
              run: test "$(jq -r .version custom_components/pecklist/manifest.json)" = "$TAG"

            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -eu
                  notes="Changes: https://gitlab.com/killswitch10/pecklist-home-assistant/-/blob/$TAG/CHANGELOG.md. Developed on GitLab: https://gitlab.com/killswitch10/pecklist-home-assistant"
                  gh release create "$TAG" --repo "$REPOSITORY" --title "$TAG" --notes "$notes" --verify-tag
